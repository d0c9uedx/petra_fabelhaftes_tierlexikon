[project]
name = "tierlexikon-backend"
version = "0.1.0"
description = "Backend für Petras fabelhaftes Tierlexikon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 (unmaintained) reads bcrypt.__about__.__version__, which bcrypt
    # removed in 4.0 - pin below that until passlib is replaced/updated.
    "bcrypt<4.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
